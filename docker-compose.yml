services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: ${POSTGRES_USER:-webhooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: {context: ., dockerfile: src/ReliableWebhook.Api/Dockerfile}
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Host=postgres;Database=webhooks;Username=${POSTGRES_USER:-webhooks};Password=${POSTGRES_PASSWORD:-local-development-only}
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, "curl --fail --silent http://localhost:8080/health > /dev/null || exit 1"], interval: 10s, timeout: 3s, retries: 10}
  worker:
    build: {context: ., dockerfile: src/ReliableWebhook.Worker/Dockerfile}
    environment:
      Database__ConnectionString: Host=postgres;Database=webhooks;Username=${POSTGRES_USER:-webhooks};Password=${POSTGRES_PASSWORD:-local-development-only}
    depends_on: {postgres: {condition: service_healthy}}
    stop_grace_period: 30s
volumes: {postgres-data: {}}
