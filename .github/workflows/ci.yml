name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: 10.0.x}
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test tests/ReliableWebhook.UnitTests --configuration Release --no-build
      - run: dotnet test tests/ReliableWebhook.IntegrationTests --configuration Release --no-build
      - run: docker compose config
